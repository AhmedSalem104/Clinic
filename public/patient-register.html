<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="إنشاء حساب مريضة في العيادة" />
    <title>إنشاء حساب مريضة | عيادتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <main class="mx-auto min-h-screen max-w-3xl px-4 py-8 sm:px-6 lg:py-14">
      <div class="mb-6 flex items-center justify-between gap-4">
        <a href="/" class="flex items-center gap-3 text-sm font-bold text-slate-900"><span class="brand-mark">+</span> عيادتي</a>
        <a href="/" class="page-link text-sm">العودة لتسجيل الدخول</a>
      </div>
      <section class="card overflow-hidden">
        <div class="border-b border-slate-100 bg-blue-50 px-5 py-6 sm:px-8">
          <h1 class="text-2xl font-bold text-slate-900">إنشاء حساب مريضة</h1>
          <p class="mt-2 text-sm leading-7 text-slate-600">أنشئي حسابًا بالبريد الإلكتروني وكلمة المرور بدون رمز تحقق. إذا حجزتِ أولًا بدون دخول، استخدمي معرّف المريضة الموجود في تأكيد الحجز لربط الحساب بنفس الملف.</p>
        </div>
        <form id="patient-registration-form" class="p-5 sm:p-8">
          <div id="registration-status" class="mb-5 hidden rounded-lg p-3 text-sm" role="status"></div>
          <div class="form-grid">
            <div>
              <label class="form-label" for="fullName">الاسم الكامل <span class="text-red-500">*</span></label>
              <input class="input" id="fullName" name="fullName" autocomplete="name" required maxlength="180" />
            </div>
            <div>
              <label class="form-label" for="dateOfBirth">تاريخ الميلاد</label>
              <input class="input" id="dateOfBirth" name="dateOfBirth" type="date" autocomplete="bday" />
            </div>
            <div>
              <label class="form-label" for="phone">رقم الهاتف <span class="text-red-500">*</span></label>
              <input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="40" />
            </div>
            <div>
              <label class="form-label" for="patientCode">معرّف المريضة من الحجز</label>
              <input class="input" id="patientCode" name="patientCode" maxlength="30" placeholder="اختياري — مثل P-..." />
              <div class="form-hint">اتركيه فارغًا إذا لم تحجزي مسبقًا.</div>
            </div>
            <div>
              <label class="form-label" for="email">البريد الإلكتروني <span class="text-red-500">*</span></label>
              <input class="input" id="email" name="email" type="email" autocomplete="email" required maxlength="255" />
            </div>
            <div>
              <label class="form-label" for="password">كلمة المرور <span class="text-red-500">*</span></label>
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
              <div class="form-hint">8 أحرف على الأقل.</div>
            </div>
            <div>
              <label class="form-label" for="confirmPassword">تأكيد كلمة المرور <span class="text-red-500">*</span></label>
              <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
            </div>
            <div>
              <label class="form-label" for="preferredContactChannel">وسيلة التواصل المفضلة</label>
              <select class="select" id="preferredContactChannel" name="preferredContactChannel">
                <option value="">غير محدد</option>
                <option value="whatsapp">واتساب</option>
                <option value="sms">رسالة نصية</option>
                <option value="phone">هاتف</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="alternatePhone">هاتف بديل</label>
              <input class="input" id="alternatePhone" name="alternatePhone" type="tel" inputmode="tel" maxlength="40" />
            </div>
            <div class="span-2">
              <label class="form-label" for="address">العنوان</label>
              <textarea class="textarea" id="address" name="address" rows="2" maxlength="500"></textarea>
            </div>
            <div>
              <label class="form-label" for="emergencyContactName">جهة اتصال للطوارئ</label>
              <input class="input" id="emergencyContactName" name="emergencyContactName" maxlength="160" />
            </div>
            <div>
              <label class="form-label" for="emergencyContactPhone">هاتف الطوارئ</label>
              <input class="input" id="emergencyContactPhone" name="emergencyContactPhone" type="tel" inputmode="tel" maxlength="40" />
            </div>
          </div>
          <label class="mt-6 flex items-start gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3 text-sm leading-6 text-slate-600">
            <input class="mt-1" type="checkbox" name="consent" required />
            <span>أوافق على إنشاء حساب تشغيلي واستخدام بيانات التواصل لإدارة الحجوزات والتنبيهات. البيانات الطبية تُسجل لاحقًا بواسطة فريق العيادة.</span>
          </label>
          <div class="mt-6 flex justify-end">
            <button class="btn btn-primary w-full sm:w-auto" type="submit">إنشاء الحساب</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/js/patient-register.js"></script>
  </body>
</html>
